<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovShadow Pro: AI Curriculum Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-font { font-family: 'Playfair Display', serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="flex flex-col lg:flex-row min-h-screen">
        
        <!-- Sidebar Navigation -->
        <aside class="w-full lg:w-80 bg-slate-900 border-b lg:border-r border-slate-800 p-6 shrink-0 flex flex-col justify-between">
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-full border border-blue-500/20">AI Curriculum Agent</span>
                <h1 class="text-2xl font-extrabold text-white mt-2">GovShadow Pro</h1>
                <p class="text-xs text-slate-400 mt-1">12-Week Executive Prosody Suite</p>
                <hr class="border-slate-800 my-4">
                <div id="weekNav" class="space-y-1 max-h-[60vh] overflow-y-auto pr-1"></div>
            </div>
            <div class="mt-6 pt-4 border-t border-slate-800">
                <label class="text-[10px] font-bold text-slate-500 uppercase">Gemini API Key (Optional)</label>
                <input type="password" id="apiKeyInput" placeholder="Runtime Auto-Inject Enabled" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-grow p-6 lg:p-10 max-w-5xl mx-auto w-full space-y-6">
            
            <!-- Header Banner -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-800">
                <div>
                    <span id="weekContextBadge" class="text-[10px] font-bold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">...</span>
                    <h2 id="weekTitleDisplay" class="text-3xl font-extrabold text-white mt-2">...</h2>
                </div>
                <div class="flex items-center gap-3">
                    <select id="voiceSelect" class="bg-slate-900 border border-slate-800 text-xs text-slate-200 rounded-xl px-3 py-2">
                        <option value="Kore" selected>Kore (Diplomatic)</option>
                        <option value="Puck">Puck (Crisp)</option>
                        <option value="Charon">Charon (Deep Westminster)</option>
                        <option value="BROWSER">Browser Native Voice</option>
                    </select>
                    <select id="speedSelect" class="bg-slate-900 border border-slate-800 text-xs text-slate-200 rounded-xl px-3 py-2">
                        <option value="0.75">0.75x Slow-Mo</option>
                        <option value="1.0" selected>1.00x Standard</option>
                        <option value="1.2">1.20x Fast-Stream</option>
                    </select>
                </div>
            </div>

            <!-- Dynamic Custom Script Generator -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex gap-3">
                <input type="text" id="customTopicInput" placeholder="Enter custom policy topic (e.g., 'Digital Sovereignty')..." class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                <button onclick="generateCustomLesson()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition">Generate AI Lesson</button>
            </div>

            <!-- Practice Tabs -->
            <div class="flex border-b border-slate-800">
                <button id="tabFormal" onclick="switchTab('formal')" class="px-5 py-2.5 text-xs font-bold border-b-2 border-blue-500 text-blue-400">Formal Policy Script</button>
                <button id="tabCasual" onclick="switchTab('casual')" class="px-5 py-2.5 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200">Casual Friday Rapport</button>
                <button id="tabVowel" onclick="switchTab('vowel')" class="px-5 py-2.5 text-xs font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200">Vowel Melody String</button>
            </div>

            <!-- Script Display Box -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 relative">
                <div id="scriptDisplay" class="serif-font text-xl leading-relaxed text-slate-100 min-h-[120px]"></div>
                <div id="statusLabel" class="text-xs font-mono text-slate-500 mt-4">Synthesizer idle.</div>
            </div>

            <!-- Action Controls -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button id="btnSynth" onclick="synthesizeHD()" class="md:col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                    <span>▶</span> <span>Synthesize Reference Audio</span>
                </button>
                <button id="btnPlay" disabled onclick="togglePlay()" class="bg-slate-900 border border-slate-800 text-slate-500 font-bold py-3.5 rounded-xl text-xs transition disabled:opacity-40">
                    Play Audio
                </button>
            </div>

            <!-- Directives & IPA -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-indigo-950/20 border border-indigo-500/20 rounded-2xl p-5">
                    <h4 class="text-xs font-bold text-indigo-300 uppercase mb-1">Coaching Directive</h4>
                    <p id="coachDisplay" class="text-xs text-slate-300 italic leading-relaxed">...</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-1">IPA Targets</h4>
                    <p id="ipaDisplay" class="text-xs text-slate-300 font-mono leading-relaxed">...</p>
                </div>
            </div>

            <!-- Utilities: Stopwatch & Recorder -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex justify-between items-center">
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">25-Min Routine Timer</span>
                        <div id="timerDisplay" class="mono-font text-3xl font-extrabold text-white mt-1">25:00</div>
                    </div>
                    <div class="flex gap-2">
                        <button id="btnTimer" onclick="toggleTimer()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Start</button>
                        <button onclick="resetTimer()" class="bg-slate-800 text-slate-300 font-bold px-3 py-2 rounded-xl text-xs">Reset</button>
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex justify-between items-center">
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Phase 4 Live Audit</span>
                        <audio id="recPlayback" controls class="h-8 mt-2 hidden"></audio>
                    </div>
                    <div class="flex gap-2">
                        <button id="btnRecStart" onclick="startRec()" class="bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Rec</button>
                        <button id="btnRecStop" disabled onclick="stopRec()" class="bg-slate-800 text-slate-500 font-bold px-3 py-2 rounded-xl text-xs disabled:opacity-40">Stop</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <audio id="audioDriver" class="hidden"></audio>

    <script>
        // System Database Initialization
        const SYLLABUS = [
            { id: 1, title: "Week 1: Schwa & Non-Rhoticity", context: "Data Science Integration", formal: "Effective  pub -lic ad-min-is- tra -tion / re- lies   heav -i-ly / on the  care -ful a- nal -y-sis of  da -ta.", pure: "Effective public administration relies heavily on the careful analysis of data.", casual: "Looking at the  sec -tor level ↗, / we  can't  just rely on gut feeling.", pureCasual: "Looking at the sector level, we can't just rely on gut feeling.", vowel: "eh-eh-ih / uh-ih-ih-ay-uhn / ih-ay-eh-ee", coach: "Target structural words 'sector' and 'indicators'. Drop terminal -r to schwa /ə/.", ipa: "Sector /ˈsek.tə/ • Indicators /ˈɪn.dɪ.keɪ.təz/" },
            { id: 6, title: "Week 6: Parenthetical Pitch Dropping", context: "Economic Reform", formal: "The pro- po -sal / , *which was pro- duced  by the com- mit -tee* ↘ , / will  fail  without funding.", pure: "The proposal, which was produced by the committee, will fail without funding.", casual: "Honestly / , *and I think everyone in this room knows this* ↘ , / we cannot delay.", pureCasual: "Honestly, and I think everyone in this room knows this, we cannot delay.", vowel: "uh-uh-oh-uhl / ih-uh-uh-oo-ay-uh-uh-ih-ee / ih-ay-ih-ao-oo-ih", coach: "Drop pitch by 3-4 semitones and accelerate +15% inside qualifying commas.", ipa: "Proposal /prəˈpəʊ.zəl/ • Opposition /ˌɒp.əˈzɪʃ.ən/" }
        ];

        let activeWeek = SYLLABUS[0];
        let activeTab = 'formal';
        let audioPlayer = document.getElementById('audioDriver');
        let timerInt = null, timerSecs = 1500;
        let mediaRec = null, chunks = [];

        window.onload = () => {
            renderNav();
            loadWeek(1);
        };

        function renderNav() {
            const nav = document.getElementById('weekNav');
            nav.innerHTML = SYLLABUS.map(w => `
                <button onclick="loadWeek(${w.id})" class="w-full text-left p-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 transition">
                    ${w.title}
                </button>
            `).join('');
        }

        function loadWeek(id) {
            activeWeek = SYLLABUS.find(w => w.id === id) || SYLLABUS[0];
            document.getElementById('weekContextBadge').textContent = activeWeek.context;
            document.getElementById('weekTitleDisplay').textContent = activeWeek.title;
            document.getElementById('coachDisplay').textContent = activeWeek.coach;
            document.getElementById('ipaDisplay').textContent = activeWeek.ipa;
            switchTab('formal');
        }

        function switchTab(tab) {
            activeTab = tab;
            const display = document.getElementById('scriptDisplay');
            if (tab === 'formal') display.innerHTML = formatMarkup(activeWeek.formal);
            else if (tab === 'casual') display.innerHTML = formatMarkup(activeWeek.casual);
            else display.innerHTML = `<span class="mono-font text-amber-400">${activeWeek.vowel}</span>`;
        }

        function formatMarkup(txt) {
            return txt.replace(/\/\//g, '<span class="text-rose-500 font-bold mx-2">||</span>')
                      .replace(/\//g, '<span class="text-rose-400 font-bold mx-1">|</span>')
                      .replace(/\*(.*?)\*/g, '<span class="text-amber-400 bg-amber-500/10 px-1 py-0.5 rounded font-bold border border-amber-500/30">$1</span>');
        }

        function pcmToWav(base64PCM, sampleRate = 24000) {
            const binary = atob(base64PCM);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const pcm16 = new Int16Array(bytes.buffer);
            const wavBuffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(wavBuffer);
            const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + pcm16.length * 2, true);
            writeStr(8, 'WAVE'); writeStr(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(36, 'data'); view.setUint32(40, pcm16.length * 2, true);
            
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) view.setInt16(offset, pcm16[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        async function synthesizeHD() {
            const voice = document.getElementById('voiceSelect').value;
            const speed = parseFloat(document.getElementById('speedSelect').value);
            const text = activeTab === 'casual' ? activeWeek.pureCasual : (activeTab === 'vowel' ? activeWeek.vowel : activeWeek.pure);

            if (voice === 'BROWSER') {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.rate = speed;
                window.speechSynthesis.speak(utter);
                return;
            }

            const status = document.getElementById('statusLabel');
            status.textContent = "Connecting to Gemini HD Audio Pipeline...";
            const key = document.getElementById('apiKeyInput').value;

            const payload = {
                contents: [{ parts: [{ text: `Speak in Received Pronunciation British English: ${text}` }] }],
                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } } }
            };

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${key}`, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
                });
                const data = await res.json();
                const pcm = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                if (pcm) {
                    const blob = pcmToWav(pcm);
                    audioPlayer.src = URL.createObjectURL(blob);
                    audioPlayer.playbackRate = speed;
                    document.getElementById('btnPlay').disabled = false;
                    status.textContent = "HD Reference Audio Ready.";
                }
            } catch (e) {
                status.textContent = "API call error. Switched to Browser fallback.";
                document.getElementById('voiceSelect').value = 'BROWSER';
                synthesizeHD();
            }
        }

        function togglePlay() {
            if (audioPlayer.paused) { audioPlayer.play(); document.getElementById('btnPlay').textContent = "Pause"; }
            else { audioPlayer.pause(); document.getElementById('btnPlay').textContent = "Play Audio"; }
        }

        function toggleTimer() {
            if (timerInt) { clearInterval(timerInt); timerInt = null; document.getElementById('btnTimer').textContent = "Start"; }
            else {
                timerInt = setInterval(() => {
                    if (timerSecs > 0) { timerSecs--; updateTimer(); }
                    else { clearInterval(timerInt); alert("Routine Complete!"); }
                }, 1000);
                document.getElementById('btnTimer').textContent = "Pause";
            }
        }

        function resetTimer() { clearInterval(timerInt); timerInt = null; timerSecs = 1500; updateTimer(); }
        function updateTimer() {
            const m = Math.floor(timerSecs / 60).toString().padStart(2, '0');
            const s = (timerSecs % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        }

        async function startRec() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRec = new MediaRecorder(stream); chunks = [];
            mediaRec.ondataavailable = e => chunks.push(e.data);
            mediaRec.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const player = document.getElementById('recPlayback');
                player.src = URL.createObjectURL(blob); player.classList.remove('hidden');
            };
            mediaRec.start();
            document.getElementById('btnRecStart').disabled = true;
            document.getElementById('btnRecStop').disabled = false;
        }

        function stopRec() {
            if (mediaRec && mediaRec.state !== "inactive") {
                mediaRec.stop();
                document.getElementById('btnRecStart').disabled = false;
                document.getElementById('btnRecStop').disabled = true;
            }
        }
    </script>
</body>
</html>
