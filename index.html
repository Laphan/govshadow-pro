<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovShadow Pro: Gemini Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .serif-font { font-family: 'Playfair Display', serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Gemini-inspired Gradients & Animations */
        .gemini-gradient {
            background: linear-gradient(135deg, #1A73E8 0%, #8AB4F8 50%, #D96570 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gemini-bg-gradient {
            background: linear-gradient(135deg, rgba(26, 115, 232, 0.1) 0%, rgba(138, 180, 248, 0.1) 50%, rgba(217, 101, 112, 0.1) 100%);
        }
        .gemini-border {
            border: 1px solid transparent;
            background: linear-gradient(#09090b, #09090b) padding-box, 
                        linear-gradient(135deg, #1A73E8, #8AB4F8, #D96570) border-box;
        }
        
        @keyframes waveform {
            0%, 100% { transform: scaleY(0.2); opacity: 0.5; }
            50% { transform: scaleY(1); opacity: 1; }
        }
        .wave-bar { animation: waveform 0.8s ease-in-out infinite; transform-origin: bottom; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar / Navigation -->
    <aside class="w-full md:w-80 border-r border-zinc-800/60 bg-zinc-950/50 flex flex-col h-screen shrink-0 backdrop-blur-xl">
        <div class="p-6 border-b border-zinc-800/60">
            <div class="flex items-center gap-2 mb-2">
                <svg class="w-5 h-5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-400">Gemini Project</span>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight gemini-gradient">GovShadow Pro</h1>
            <p class="text-xs text-zinc-500 mt-1">Executive Prosody Engine</p>
            
            <div class="mt-5">
                <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1 block">Authentication</label>
                <input type="password" id="geminiApiKey" placeholder="Paste Gemini API Key..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-300 focus:outline-none focus:border-blue-500/50 transition shadow-inner">
            </div>
        </div>

        <div class="flex-grow overflow-y-auto p-4 space-y-1" id="curriculumNav">
            <!-- Nav buttons injected via JS -->
        </div>
        
        <div class="p-4 border-t border-zinc-800/60 bg-zinc-950">
            <div class="text-[10px] text-zinc-500 text-center flex items-center justify-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Local Browser Sandbox Active
            </div>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-grow h-screen overflow-y-auto bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/10 via-zinc-950 to-zinc-950 p-6 md:p-10 relative">
        
        <!-- Header Controls -->
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-end gap-6 mb-8 border-b border-zinc-800/60 pb-6">
            <div class="max-w-2xl">
                <span id="weekContext" class="text-[10px] font-bold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-full border border-blue-500/20">Context</span>
                <h2 id="weekTitle" class="text-3xl font-extrabold text-white mt-3 tracking-tight">Title</h2>
                <p id="weekCoach" class="text-sm text-zinc-400 mt-2 leading-relaxed">Directive</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto shrink-0">
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase mb-1">Voice Profile</label>
                    <select id="voiceSelect" class="bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 transition">
                        <option value="Kore" selected>Kore (Diplomatic)</option>
                        <option value="Puck">Puck (Crisp Executive)</option>
                        <option value="Charon">Charon (Westminster)</option>
                        <option value="Sulafat">Sulafat (Scholar)</option>
                        <option value="BROWSER">Local Browser Synth</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase mb-1">Tempo</label>
                    <select id="speedSelect" onchange="updateSpeed()" class="bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 transition">
                        <option value="0.75">0.75x (Slow-Mo)</option>

        <!-- Main Content Grid -->

                    <button id="tabCasual" onclick="setTrack('casual')" class="pb-3 text-xs font-semibold border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 transition">Casual Rapport</button>

                        Phonetic IPA Targets

    <!-- Hidden Audio Driver -->

    <script>
        // System Curriculum Database (Weeks 1-6 Pre-loaded for robust context)
        const DATABASE = [
            {
                id: 1, title: "Week 1: The Schwa & Non-Rhoticity", context: "Data Science Context",
                coach: "Target structural words 'sector' and 'indicators'. Drop terminal -r to schwa /ə/.",
                ipa: "Sector /ˈsek.tə/<br>Indicators /ˈɪn.dɪ.keɪ.təz/<br>Administration /ədˌmɪn.ɪˈstreɪ.ʃən/",
                formal: "Effective  pub -lic ad-min-is- tra -tion / re- lies   heav -i-ly / on the  care -ful a- nal -y-sis of  da -ta.",
                pure: "Effective public administration relies heavily on the careful analysis of data.",
                casual: "Looking at the  sec -tor level ↗, / we  can't  just rely on gut feeling.",
                pureCasual: "Looking at the sector level, we can't just rely on gut feeling.",
                vowel: "eh-eh-ih / uh-ih-ih-ay-uhn / ih-ay-eh-ee"
            },
            {
                id: 4, title: "Week 4: Consonant-to-Vowel Linking", context: "Institutional Transparency",
                coach: "Do not stop speaking between words. Smoothly slide the final consonant into the leading vowel without breaking airflow.",
                ipa: "Analysis of /əˈnæl.ə.sɪ.səv/<br>Order of /ˈɔː.də.rəv/<br>End of /end.əv/",
                formal: "This is  an  a-nal-y-sis_of  /  ev-i-dence_and  /  o-pen_ad-min-is-tra-tion .",
                pure: "This is an analysis of evidence and open administration.",
                casual: "Honestly, / it's *an_ab-so-lute_ob*-sta-cle / if the *lack_of* clarity / *is_an* issue.",
                pureCasual: "Honestly, it's an absolute obstacle if the lack of clarity is an issue.",
                vowel: "ih-ih-uh-ae-uh-ih-uh / eh-ih-uh-uhn / oh-uhn-uh-ih-ih-ay-uhn"
            },
            {
                id: 5, title: "Week 5: Parliamentary Rule of Three", context: "Policy Metrics",
                coach: "Let vocal pitch climb step-by-step on items 1 and 2, then drop decisively on the final item to project unshakeable authority.",
                ipa: "Transparency /trænˈspær.ən.si/<br>Accountability /əˌkaʊn.təˈbɪl.ə.ti/<br>Integrity /ɪnˈteɡ.rə.ti/",
                formal: "Our  pri -ma-ry goals are / trans- par -en-cy ↗, / ac-count-a- bil -i-ty ↗, / and leg-is- la -tive in- teg -ri-ty ↘.",
                pure: "Our primary goals are transparency, accountability, and legislative integrity.",
                casual: "To get people on board, / we need to  lis -ten ↗, / col- lab -or-ate ↗, / and de- liv -er ↘.",
                pureCasual: "To get people on board, we need to listen, collaborate, and deliver.",
                vowel: "ao-ae-ee-oh-ah / ae-ae-uh-ee / uh-ao-uh-ih-ih-ee / uh-eh-ih-ay-ih-ih-eh-ih-ee"
            },
            {
                id: 6, title: "Week 6: Parenthetical Pitch Dropping", context: "Economic Reform",
                coach: "Drop fundamental pitch by 3-4 semitones and accelerate +15% inside qualifying commas. Spring back to baseline on the main verb.",
                ipa: "Proposal /prəˈpəʊ.zəl/<br>Opposition /ˌɒp.əˈzɪʃ.ən/<br>Executed /ˈek.sɪ.kjuː.tɪd/",
                formal: "The pro- po -sal / , *which was pro- duced  by the com- mit -tee* ↘ , / will  fail  without funding.",
                pure: "The proposal, which was produced by the committee, will fail without funding.",
                casual: "Honestly / , *and I think everyone in this room knows this* ↘ , / we cannot delay.",
                pureCasual: "Honestly, and I think everyone in this room knows this, we cannot delay.",
                vowel: "uh-uh-oh-uhl / ih-uh-uh-oo-ay-uh-uh-ih-ee / ih-ay-ih-ao-oo-ih"
            }
        ];

        let currentWeek = DATABASE[3]; // Default Week 6
        let currentTrack = 'formal';
        let audioSrc = null;
        let isPlaying = false;
        let pRate = 1.0;

        // Init App
        window.onload = () => {
            buildNav();
            loadWeek(6);
        };

        function buildNav() {
            const nav = document.getElementById('curriculumNav');
            nav.innerHTML = DATABASE.map(w => `
                <button id="navBtn-${w.id}" onclick="loadWeek(${w.id})" class="w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition-all border border-transparent text-zinc-500 hover:text-zinc-200 hover:bg-zinc-900">
                    <span class="block text-[9px] opacity-70 uppercase tracking-widest font-mono mb-0.5">Week ${w.id}</span>
                    ${w.title.split(': ')[1]}
                </button>
            `).join('');
        }

        function loadWeek(id) {
            currentWeek = DATABASE.find(w => w.id === id);
            
            // Highlight Nav
            DATABASE.forEach(w => {
                const btn = document.getElementById(`navBtn-${w.id}`);
                btn.className = w.id === id 
                    ? "w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition-all bg-zinc-900 border border-zinc-800 text-blue-400"
                    : "w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition-all border border-transparent text-zinc-500 hover:text-zinc-200 hover:bg-zinc-900";
            });

            document.getElementById('weekContext').textContent = currentWeek.context;
            document.getElementById('weekTitle').textContent = currentWeek.title;
            document.getElementById('weekCoach').textContent = currentWeek.coach;
            document.getElementById('ipaDisplay').innerHTML = currentWeek.ipa;

            setTrack('formal');
            resetPlayer();
        }

        function setTrack(track) {
            currentTrack = track;
            
            // Tab styling
            ['formal', 'casual', 'vowel'].forEach(t => {
                const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (t === track) btn.className = "pb-3 text-xs font-bold border-b-2 border-blue-500 text-blue-400 transition";
                else btn.className = "pb-3 text-xs font-semibold border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 transition";
            });

            const disp = document.getElementById('scriptDisplay');
            if (track === 'formal') disp.innerHTML = parseMarkup(currentWeek.formal);
            else if (track === 'casual') disp.innerHTML = parseMarkup(currentWeek.casual);
            else disp.innerHTML = `<span class="mono-font text-amber-400/90 leading-relaxed">${currentWeek.vowel}</span>`;

            resetPlayer();
        }

        function parseMarkup(text) {
            return text
                .replace(/\/\//g, '<span class="text-rose-500 font-bold mx-2">||</span>')
                .replace(/\//g, '<span class="text-rose-400 font-bold mx-1">|</span>')
                .replace(/\*(.*?)\*/g, '<span class="text-amber-400 bg-amber-500/10 px-1 py-0.5 rounded font-bold border border-amber-500/30">$1</span>')
                .replace(/_(.*?)_/g, '<span class="text-emerald-400 border-b border-dashed border-emerald-500 font-bold">_$1_</span>')
                .replace(/↘/g, '<span class="text-amber-400 font-bold">↘</span>')
                .replace(/↗/g, '<span class="text-indigo-400 font-bold">↗</span>');
        }

        function updateSpeed() {
            pRate = parseFloat(document.getElementById('speedSelect').value);
            const driver = document.getElementById('geminiAudioDriver');
            if (driver) driver.playbackRate = pRate;
        }

        // --- Gemini TTS Integration Core ---
        
        function pcmToWavBlob(base64PCM, sampleRate = 24000) {
            const raw = atob(base64PCM);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            const pcm16 = new Int16Array(bytes.buffer);
            
            const wavBuffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(wavBuffer);
            const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + pcm16.length * 2, true);
            writeStr(8, 'WAVE'); writeStr(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(36, 'data'); view.setUint32(40, pcm16.length * 2, true);
            
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) view.setInt16(offset, pcm16[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        async function generateHDAudio() {
            const apiKey = document.getElementById('geminiApiKey').value.trim();
            const voice = document.getElementById('voiceSelect').value;
            const btnSynth = document.getElementById('btnSynth');
            const status = document.getElementById('synthStatus');
            
            let targetText = currentWeek.pure;
            if (currentTrack === 'casual') targetText = currentWeek.pureCasual;
            if (currentTrack === 'vowel') targetText = currentWeek.vowel;

            // Browser Fallback logic
            if (voice === 'BROWSER' || !apiKey) {
                if (!apiKey && voice !== 'BROWSER') alert("Please paste your Gemini API Key, or use Browser Fallback.");
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(targetText);
                utter.rate = pRate;
                const voices = window.speechSynthesis.getVoices();
                const uk = voices.find(v => v.lang.includes('en-GB'));
                if (uk) utter.voice = uk;
                window.speechSynthesis.speak(utter);
                status.textContent = "Browser Engine Active";
                return;
            }

            btnSynth.disabled = true;
            status.innerHTML = `<span class="text-blue-400">Requesting Stream...</span>`;

            const payload = {
                contents: [{ parts: [{ text: `Speak in clear, authoritative British Received Pronunciation. ${currentWeek.coach} Text to read: ${targetText}` }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                }
            };

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
                });
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const b64 = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                
                if (b64) {
                    const blob = pcmToWavBlob(b64);
                    audioSrc = URL.createObjectURL(blob);
                    
                    const driver = document.getElementById('geminiAudioDriver');
                    driver.src = audioSrc;
                    driver.playbackRate = pRate;
                    
                    const btnPlay = document.getElementById('btnPlay');
                    btnPlay.disabled = false;
                    btnPlay.className = "sm:w-32 bg-white hover:bg-zinc-200 text-zinc-950 font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2";
                    
                    status.innerHTML = `<span class="text-emerald-400">TTS Audio Ready</span>`;
                }
            } catch (err) {
                status.innerHTML = `<span class="text-red-400">Error: Check API Key</span>`;
            } finally {
                btnSynth.disabled = false;
            }
        }

        function togglePlayback() {
            const driver = document.getElementById('geminiAudioDriver');
            const icon = document.getElementById('playIcon');
            const text = document.getElementById('playText');
            const wave = document.getElementById('waveform');

            if (isPlaying) {
                driver.pause();
                icon.textContent = "▶"; text.textContent = "Play";
                wave.style.opacity = "0";
                isPlaying = false;
            } else {
                driver.playbackRate = pRate;
                driver.play();
                icon.textContent = "⏸"; text.textContent = "Pause";
                wave.style.opacity = "1";
                isPlaying = true;
            }
        }

        function onPlaybackEnd() {
            document.getElementById('playIcon').textContent = "▶";
            document.getElementById('playText').textContent = "Play";
            document.getElementById('waveform').style.opacity = "0";
            isPlaying = false;
        }

        function resetPlayer() {
            const driver = document.getElementById('geminiAudioDriver');
            driver.pause(); driver.currentTime = 0; onPlaybackEnd();
            
            if (audioSrc) { URL.revokeObjectURL(audioSrc); audioSrc = null; }
            
            const btnPlay = document.getElementById('btnPlay');
            btnPlay.disabled = true;
            btnPlay.className = "sm:w-32 bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-zinc-400 font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2 disabled:opacity-30";
            document.getElementById('synthStatus').textContent = "Idle";
        }

        // --- Timer Utility ---
        let timerInt = null;
        let tSecs = 1500;

        function toggleTimer() {
            const btn = document.getElementById('btnTimer');
            if (timerInt) {
                clearInterval(timerInt); timerInt = null;
                btn.textContent = "Start Timer";
            } else {
                timerInt = setInterval(() => {
                    if (tSecs > 0) { tSecs--; updateTimerUI(); }
                    else { clearInterval(timerInt); alert("25-Min Routine Complete!"); }
                }, 1000);
                btn.textContent = "Pause Timer";
            }
        }

        function resetTimer() {
            if (timerInt) clearInterval(timerInt); timerInt = null;
            tSecs = 1500; updateTimerUI();
            document.getElementById('btnTimer').textContent = "Start Timer";
        }

        function updateTimerUI() {
            const m = Math.floor(tSecs / 60).toString().padStart(2, '0');
            const s = (tSecs % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        }

        // --- Mic Audit Utility ---
        let mediaRec = null;
        let audioChunks = [];

        async function startMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(stream);
                audioChunks = [];
                mediaRec.ondataavailable = e => audioChunks.push(e.data);
                mediaRec.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const player = document.getElementById('audioPlayback');
                    player.src = URL.createObjectURL(blob);
                    player.classList.remove('hidden');
                };
                mediaRec.start();
                document.getElementById('btnRecStart').disabled = true;
                document.getElementById('btnRecStop').disabled = false;
            } catch (err) { alert("Mic Access Error: " + err.message); }
        }

        function stopMic() {
            if (mediaRec && mediaRec.state !== "inactive") {
                mediaRec.stop();
                document.getElementById('btnRecStart').disabled = false;
                document.getElementById('btnRecStop').disabled = true;
            }
        }
    </script>
</body>
</html>
